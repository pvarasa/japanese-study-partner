services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nihongo
      POSTGRES_USER: nihongo
      POSTGRES_PASSWORD: nihongo
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nihongo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://nihongo:nihongo@db/nihongo
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WHISPER_ENABLED: ${WHISPER_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
