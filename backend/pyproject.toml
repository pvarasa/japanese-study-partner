[project]
name = "backend"
version = "0.1.0"
description = "日本語 Study Partner — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.89.0",
    "beautifulsoup4>=4.14.3",
    "faster-whisper>=1.0.3",
    "fastapi>=0.135.3",
    "fugashi>=1.5.2",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.9",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.49",
    "unidic-lite>=1.0.8",
    "uvicorn>=0.43.0",
]

[project.optional-dependencies]
postgres = [
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
