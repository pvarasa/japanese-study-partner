[project]
name = "backend"
version = "0.1.0"
description = "日本語 Study Partner — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2",
    "beautifulsoup4>=4.15.0",
    "faster-whisper>=1.2.1",
    "fastapi>=0.141.1",
    "fugashi>=1.5.2",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "unidic-lite>=1.0.8",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
postgres = [
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
